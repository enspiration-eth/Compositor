name: Deploy web build to GitHub Pages

# Builds Photoshop.eth for the web (web/): compiles the original C pixel kernels in Compositor/Rendering to WebAssembly
# with Emscripten, type-checks and bundles the TypeScript shell with Vite, smoke-tests it in headless Chromium, and
# publishes web/dist to GitHub Pages.
on:
  push:
    branches: [web]
    paths: ['web/**', 'Compositor/Rendering/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.10

      - name: Compile C kernels to WebAssembly
        run: npm run build:wasm

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Smoke test (headless Chromium)
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort --base /${{ github.event.repository.name }}/ &
          sleep 3
          URL=http://localhost:4173/${{ github.event.repository.name }}/ SHOTS=$RUNNER_TEMP/shots npm run test:e2e

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
